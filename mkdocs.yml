site_name: L.E.T.H.A.L.
site_description: The official wiki for the L.E.T.H.A.L. tabletop roleplaying game.
site_author: lampmann
site_url: https://lampmann.github.io/L.E.T.H.A.L./

repo_name: lampmann/L.E.T.H.A.L.
repo_url: https://github.com/lampmann/L.E.T.H.A.L.
edit_uri: edit/main/docs/

# Licence is undecided. Until you choose one, this asserts copyright without
# granting anything. See "Licensing" in README.md for how to set it.
copyright: Copyright &copy; 2026 lampmann. Licence to be confirmed.

theme:
  name: material
  language: en
  # System fonts, like Wikipedia. Keeps the wiki fast and avoids a Google Fonts request.
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.tooltips

extra_css:
  - stylesheets/wiki.css

extra_javascript:
  - javascripts/mathjax.js
  # MathJax 3.2.2, vendored rather than loaded from a CDN: the wiki then has no
  # third-party runtime dependency, renders offline, and cannot be broken by
  # someone else's outage or compromise (cf. polyfill.io, 2024). The SVG build
  # is used because it embeds its fonts — the CommonHTML build would need a
  # further ~2 MB of woff files alongside it.
  - javascripts/mathjax/tex-mml-svg.js

plugins:
  - search

markdown_extensions:
  # Wiki furniture: infoboxes, footnotes, definition lists, abbreviations.
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  # Abbreviations live outside docs/ so they are appended to every page
  # without also being built as a page of their own.
  - pymdownx.snippets:
      base_path:
        - includes
      auto_append:
        - abbreviations.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lampmann/L.E.T.H.A.L.
      name: L.E.T.H.A.L. on GitHub

nav:
  - Home: index.md
  - Rules:
      - Rule Language: rules/ace.md
      - Core Resolution: rules/index.md
      - Ability Scores: rules/ability-scores.md
      - Skills: rules/skills.md
      - Combat: rules/combat.md
      - Character Creation: rules/character-creation.md
  - Magic:
      - Aspects: magic/aspects.md
      - Spell Notation: magic/notation.md
  - Game Master:
      - Running the Game: gm/index.md
  - Design Notes:
      - About These Notes: notes/index.md
      - Decisions: notes/decisions.md
      - Open Questions: notes/open-questions.md
      - Scratchpad: notes/scratchpad.md
  - Reference:
      - Glossary: glossary.md
      - Editing This Wiki: contributing.md
